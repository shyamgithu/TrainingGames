<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hapag-Lloyd Training Games</title>
    <!-- EmailJS SDK -->
    <script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/email.min.js"></script>
    <style>
        /* Your existing CSS styles here - keeping them the same */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f5f5f5;
            color: #333;
            line-height: 1.6;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }

        .header {
            background: linear-gradient(135deg, #ff6b35, #f7931e);
            color: white;
            text-align: center;
            padding: 40px 20px;
            border-radius: 15px;
            margin-bottom: 30px;
            box-shadow: 0 8px 32px rgba(255, 107, 53, 0.3);
        }

        .header h1 {
            font-size: 3em;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }

        .header p {
            font-size: 1.2em;
            opacity: 0.9;
        }

        /* User Registration Modal */
        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0,0,0,0.5);
        }

        .modal-content {
            background-color: white;
            margin: 10% auto;
            padding: 30px;
            border-radius: 15px;
            width: 90%;
            max-width: 500px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
        }

        .modal h2 {
            color: #ff6b35;
            margin-bottom: 20px;
            text-align: center;
        }

        .form-group {
            margin-bottom: 15px;
        }

        .form-group label {
            display: block;
            margin-bottom: 5px;
            font-weight: 600;
            color: #333;
        }

        .form-group input, .form-group select {
            width: 100%;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 1em;
            transition: border-color 0.3s ease;
        }

        .form-group input:focus, .form-group select:focus {
            outline: none;
            border-color: #ff6b35;
        }

        .btn {
            background: #ff6b35;
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 25px;
            cursor: pointer;
            font-size: 1em;
            font-weight: 600;
            transition: all 0.3s ease;
            margin: 5px;
            box-shadow: 0 4px 15px rgba(255, 107, 53, 0.3);
        }

        .btn:hover {
            background: #e55a2b;
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(255, 107, 53, 0.4);
        }

        .user-info {
            background: white;
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 20px;
            border: 2px solid #ff6b35;
            text-align: center;
        }

        .user-info h3 {
            color: #ff6b35;
            margin-bottom: 10px;
        }

        /* Add all your existing game styles here... */
        .nav-buttons {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-bottom: 30px;
            flex-wrap: wrap;
        }

        .nav-btn {
            background: white;
            color: #ff6b35;
            border: 2px solid #ff6b35;
            padding: 12px 24px;
            border-radius: 25px;
            cursor: pointer;
            font-size: 1em;
            font-weight: 600;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(255, 107, 53, 0.2);
        }

        .nav-btn:hover, .nav-btn.active {
            background: #ff6b35;
            color: white;
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(255, 107, 53, 0.4);
        }

        .game-section {
            display: none;
            background: white;
            border-radius: 15px;
            padding: 30px;
            margin-bottom: 30px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
            border: 1px solid #e0e0e0;
        }

        .game-section.active {
            display: block;
        }

        .game-section h2 {
            color: #ff6b35;
            text-align: center;
            margin-bottom: 30px;
            font-size: 2.5em;
        }

        /* Add the rest of your existing styles... */
        /* I'm keeping this short for readability, but include ALL your existing CSS */
    </style>
</head>
<body>
    <!-- User Registration Modal -->
    <div id="userModal" class="modal">
        <div class="modal-content">
            <h2>🚢 Welcome to Hapag-Lloyd Training Games</h2>
            <p style="text-align: center; margin-bottom: 20px; color: #666;">Please enter your details to start playing</p>
            
            <div class="form-group">
                <label>Full Name *</label>
                <input type="text" id="userName" placeholder="Enter your full name" required>
            </div>
            
            <div class="form-group">
                <label>Employee ID</label>
                <input type="text" id="employeeId" placeholder="Enter your employee ID (optional)">
            </div>
            
            <div class="form-group">
                <label>Department *</label>
                <select id="userDepartment" required>
                    <option value="">Select your department</option>
                    <option value="Operations">Operations</option>
                    <option value="Commercial">Commercial</option>
                    <option value="Finance & Accounting">Finance & Accounting</option>
                    <option value="IT">Information Technology</option>
                    <option value="Human Resources">Human Resources</option>
                    <option value="Legal">Legal</option>
                    <option value="Procurement">Procurement</option>
                    <option value="Fleet Management">Fleet Management</option>
                    <option value="Customer Service">Customer Service</option>
                    <option value="Sales">Sales</option>
                    <option value="Other">Other</option>
                </select>
            </div>
            
            <div class="form-group">
                <label>Location/Office *</label>
                <input type="text" id="userLocation" placeholder="e.g., Hamburg, Singapore, New York" required>
            </div>
            
            <div class="form-group">
                <label>Email Address *</label>
                <input type="email" id="userEmail" placeholder="your.email@hapag-lloyd.com" required>
            </div>
            
            <div style="text-align: center; margin-top: 25px;">
                <button onclick="registerUser()" class="btn">🚀 Start Playing</button>
            </div>
        </div>
    </div>

    <div class="container">
        <!-- User Info Display -->
        <div id="userInfo" class="user-info" style="display: none;">
            <h3>Welcome, <span id="displayName"></span>!</h3>
            <p><span id="displayDepartment"></span> | <span id="displayLocation"></span></p>
            <button onclick="changeUser()" class="btn" style="font-size: 0.9em; padding: 8px 16px;">Change User</button>
        </div>

        <div class="header">
            <h1>🚢 Hapag-Lloyd Training Games</h1>
            <p>Interactive Learning Platform for Maritime Excellence</p>
        </div>

        <!-- Your existing navigation and games go here -->
        <div class="nav-buttons">
            <button class="nav-btn active" onclick="showGame('wordSearch')">🔍 Word Search</button>
            <button class="nav-btn" onclick="showGame('quiz')">📚 Shipping Quiz</button>
            <button class="nav-btn" onclick="showGame('containerTypes')">📦 Container Types</button>
        </div>

        <!-- Add all your existing game sections here... -->
        <!-- I'm keeping this short, but include ALL your existing game HTML -->
        
    </div>

    <script>
        // EmailJS Configuration
        (function(){
            emailjs.init("YOUR_EMAILJS_USER_ID"); // Replace with your EmailJS User ID
        })();

        // User Management
        let currentUser = null;

        // Show registration modal on page load
        window.onload = function() {
            document.getElementById('userModal').style.display = 'block';
        };

        function registerUser() {
            const name = document.getElementById('userName').value.trim();
            const employeeId = document.getElementById('employeeId').value.trim();
            const department = document.getElementById('userDepartment').value;
            const location = document.getElementById('userLocation').value.trim();
            const email = document.getElementById('userEmail').value.trim();

            if (!name || !department || !location || !email) {
                alert('Please fill in all required fields (marked with *)');
                return;
            }

            // Email validation
            const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
            if (!emailRegex.test(email)) {
                alert('Please enter a valid email address');
                return;
            }

            currentUser = {
                name: name,
                employeeId: employeeId || 'N/A',
                department: department,
                location: location,
                email: email,
                registrationTime: new Date().toISOString(),
                scores: {}
            };

            // Hide modal and show user info
            document.getElementById('userModal').style.display = 'none';
            document.getElementById('userInfo').style.display = 'block';
            document.getElementById('displayName').textContent = name;
            document.getElementById('displayDepartment').textContent = department;
            document.getElementById('displayLocation').textContent = location;

            // Send registration email
            sendRegistrationEmail();

            // Initialize games
            initWordSearch();
            initContainerGame();
            updateQuizStats();
        }

        function changeUser() {
            currentUser = null;
            document.getElementById('userInfo').style.display = 'none';
            document.getElementById('userModal').style.display = 'block';
            
            // Clear form
            document.getElementById('userName').value = '';
            document.getElementById('employeeId').value = '';
            document.getElementById('userDepartment').value = '';
            document.getElementById('userLocation').value = '';
            document.getElementById('userEmail').value = '';
        }

        function sendRegistrationEmail() {
            const templateParams = {
                to_email: 'your-email@hapag-lloyd.com', // Replace with your email
                user_name: currentUser.name,
                employee_id: currentUser.employeeId,
                department: currentUser.department,
                location: currentUser.location,
                user_email: currentUser.email,
                registration_time: new Date(currentUser.registrationTime).toLocaleString(),
                message_type: 'User Registration'
            };

            emailjs.send('YOUR_SERVICE_ID', 'YOUR_TEMPLATE_ID', templateParams)
                .then(function(response) {
                    console.log('Registration email sent successfully!', response.status, response.text);
                }, function(error) {
                    console.log('Failed to send registration email...', error);
                });
        }

        function sendScoreEmail(gameType, score, totalQuestions = null) {
            if (!currentUser) return;

            currentUser.scores[gameType] = {
                score: score,
                totalQuestions: totalQuestions,
                completedAt: new Date().toISOString()
            };

            const templateParams = {
                to_email: 'your-email@hapag-lloyd.com', // Replace with your email
                user_name: currentUser.name,
                employee_id: currentUser.employeeId,
                department: currentUser.department,
                location: currentUser.location,
                user_email: currentUser.email,
                game_type: gameType,
                score: score,
                total_questions: totalQuestions || 'N/A',
                percentage: totalQuestions ? Math.round((score / totalQuestions) * 100) + '%' : 'N/A',
                completed_at: new Date().toLocaleString(),
                message_type: 'Game Score'
            };

            emailjs.send('YOUR_SERVICE_ID', 'YOUR_TEMPLATE_ID', templateParams)
                .then(function(response) {
                    console.log('Score email sent successfully!', response.status, response.text);
                }, function(error) {
                    console.log('Failed to send score email...', error);
                });
        }

        // Modified game completion functions
        function endQuiz() {
            quizActive = false;
            const percentage = Math.round((quizScore / quizQuestions.length) * 100);
            
            // Send score email
            sendScoreEmail('Shipping Quiz', quizScore, quizQuestions.length);
            
            document.getElementById('questionText').innerHTML = `
                <h3>Quiz Complete!</h3>
                <p>Your Score: ${quizScore} out of ${quizQuestions.length} (${percentage}%)</p>
                <p>${percentage >= 80 ? 'Excellent work! 🎉' : percentage >= 60 ? 'Good job! 👍' : 'Keep studying! 📚'}</p>
                <p style="color: #666; font-size: 0.9em; margin-top: 15px;">✅ Your score has been recorded and sent for tracking.</p>
            `;
            
            document.getElementById('optionsContainer').innerHTML = '';
            document.getElementById('startQuizBtn').style.display = 'inline-block';
            document.getElementById('startQuizBtn').textContent = '🔄 Try Again';
        }

        function updateWordSearchStats() {
            document.getElementById('wordsFound').textContent = foundWords.length;
            document.getElementById('totalWords').textContent = wordSearchTerms.length;
            displayWordList();
            
            if (foundWords.length === wordSearchTerms.length) {
                // Send completion email
                sendScoreEmail('Word Search', foundWords.length, wordSearchTerms.length);
                
                setTimeout(() => {
                    alert('Congratulations! You found all the words! 🎉\n\nYour completion has been recorded.');
                }, 500);
            }
        }

        function updateContainerStats() {
            document.getElementById('containerMatches').textContent = containerMatches;
            
            if (containerMatches === containerData.length) {
                // Send completion email
                sendScoreEmail('Container Matching', containerMatches, containerData.length);
                
                setTimeout(() => {
                    alert('Congratulations! You matched all container types! 🎉\n\nYour completion has been recorded.');
                }, 500);
            }
        }

        // Add all your existing game logic here...
        // (Include all the existing JavaScript functions)
    </script>
</body>
</html>
